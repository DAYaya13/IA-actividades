const bytes=b64=>Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
document.getElementById('unlock').addEventListener('submit',async e=>{e.preventDefault();error.hidden=true;if(!window.crypto?.subtle){error.textContent='Abre el enlace en Chrome o Safari mediante HTTPS para poder ingresar.';error.hidden=false;return;}submit.disabled=true;submit.textContent='Abriendo tu invitación…';try{const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(field.value),'PBKDF2',false,['deriveKey']);const aes=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},aes,bytes(payload.data));const html=new TextDecoder().decode(plain);field.value='';document.open();document.write(html);document.close();}catch{error.textContent='La clave no es correcta. Revísala e inténtalo de nuevo.';error.hidden=false;submit.disabled=false;submit.textContent='Abrir mi invitación 🌺';field.focus();}});
