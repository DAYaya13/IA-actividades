<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de la Misión — Arma tu nave</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E2761;--purple:#41328D;--lav:#7E63F4;--coral:#FF6B4A;--sky:#CADCFC;--soft:#F1EEFD;--text:#2A2360;--muted:#5E5A7E}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:"Nunito",system-ui,sans-serif;line-height:1.5;
 background:
  radial-gradient(1px 1px at 12% 20%,#fff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 72% 12%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 40% 70%,#fff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 88% 60%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 25% 90%,#fff 50%,transparent 51%),
  radial-gradient(circle at 85% 0%,#41328D 0,#1E2761 55%);}
.wrap{max-width:920px;margin:0 auto;padding:26px 18px 40px;display:grid;grid-template-columns:1fr 290px;gap:24px;align-items:start}
@media(max-width:720px){.wrap{grid-template-columns:1fr}.ship{order:-1}}
h1,h2{font-family:"Baloo 2","Trebuchet MS",sans-serif;line-height:1.15;margin:.1em 0 .35em}
h1{font-size:clamp(1.9rem,5vw,2.7rem);color:#fff}
h2{font-size:1.45rem;color:var(--purple)}
.lead{color:var(--sky);margin:0 0 14px}
.muted{color:var(--muted)}
.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 12px 30px rgba(10,10,40,.35)}
.steps{display:flex;gap:6px;margin:0 0 16px}
.steps i{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.2)}
.steps i.on{background:var(--coral)}
.kicker{color:var(--lav);font-weight:700;margin:0}
input{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:2px solid #DDD6FB;background:var(--soft);color:var(--text);margin:6px 0 12px}
input::placeholder{color:#9a94bf}
label{font-weight:700}
button{font:700 1rem "Nunito",sans-serif;cursor:pointer;border:0;border-radius:14px;padding:12px 18px}
button:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.btn{background:var(--coral);color:#fff;margin-top:16px;box-shadow:0 4px 0 #D9492B}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #D9492B}
.btn:disabled{background:#E3DFF3;color:#9a94bf;box-shadow:none;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.chip{background:var(--soft);color:var(--text);border:2px solid transparent;text-align:left}
.chip:hover{border-color:#DDD6FB}
.chip b{display:block;font-size:1rem}
.chip small{color:var(--muted);font-weight:400}
.chip.sel{background:var(--purple);color:#fff}
.chip.sel small{color:var(--sky)}
.tip{margin-top:16px;padding:12px 16px;border-radius:14px;background:var(--purple);color:#fff}
.tip:empty{display:none}
.ship{position:sticky;top:18px;text-align:center;background:var(--navy);border:2px solid rgba(202,220,252,.25);color:#fff;box-shadow:none}
.ship svg{width:100%;max-width:200px}
.part{opacity:0;transform:translateY(-50px);transition:opacity .3s,transform .5s cubic-bezier(.3,1.7,.5,1)}
.part.on{opacity:1;transform:none}
.ghost path{fill:none;stroke:rgba(202,220,252,.28);stroke-width:1.2;stroke-dasharray:3 4}
.ship{overflow:hidden}
.space{position:relative;border-radius:16px;background:
 radial-gradient(1px 1px at 20% 30%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 70% 15%,#fff 50%,transparent 51%),
 radial-gradient(1px 1px at 85% 55%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 35% 75%,#fff 50%,transparent 51%),
 radial-gradient(1.5px 1.5px at 55% 45%,#CADCFC 50%,transparent 51%),#141a45;background-size:100% 120px;}
.space.warp{animation:warp .35s linear infinite}
@keyframes warp{to{background-position:0 120px}}
#flame{opacity:0}
.ghost{transition:opacity .4s}.done .ghost{opacity:0}
.launch #flame{opacity:1;animation:flick .12s ease-in-out infinite alternate}
@keyframes flick{from{transform:scaleY(.85);transform-origin:110px 296px}to{transform:scaleY(1.15);transform-origin:110px 296px}}
#rocket.shake{animation:shake .08s infinite}
@keyframes shake{0%{transform:translate(1px,0)}50%{transform:translate(-1px,1px)}100%{transform:translate(1px,-1px)}}
#rocket.fly{animation:fly 1.8s cubic-bezier(.5,0,.9,.4) forwards}
@keyframes fly{to{transform:translateY(-460px)}}
#rocket.back{animation:back 1.6s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes back{from{transform:translateY(380px)}to{transform:translateY(-20px)}}
#rocket.float{transform:translateY(-20px);animation:float 2.4s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(-20px)}to{transform:translateY(-30px)}}
.smoke{fill:#E7E3F7;opacity:0}
.launch .smoke{animation:puff 1.6s ease-out infinite}
@keyframes puff{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.8)}}
.count{position:absolute;inset:0;display:grid;place-items:center;font:800 5rem "Baloo 2",sans-serif;color:#fff;text-shadow:0 0 20px #FF6B4A;pointer-events:none}
@media(prefers-reduced-motion:reduce){.part{transition:none;transform:none}#rocket.fly,#rocket.back,#rocket.float,#rocket.shake,.space.warp{animation:none}}
.rank{font-family:"Baloo 2",sans-serif;color:var(--coral);font-size:1.3rem;margin-top:6px}
.who{color:var(--sky)}
.final{font-family:"Baloo 2",sans-serif;font-size:1.1rem;background:var(--soft);border:2px dashed var(--lav);border-radius:14px;padding:14px;margin:12px 0;color:var(--purple);word-break:break-word}
</style>
</head>
<body>
<div class="wrap">
  <main>
    <h1>Arma tu nave de comandante</h1>
    <p class="lead">5 pasos. No hay respuestas incorrectas: cada decisión construye una parte de tu nave.</p>
    <div class="steps" id="bar"></div>
    <div class="card" id="stage"></div>
  </main>
  <aside class="ship card">
    <div class="space" id="space"><svg viewBox="0 0 230 330" aria-label="Tu nave de bloques" id="shipSvg"></svg><div class="count" id="count"></div></div>
    <div class="rank" id="rank">Aprendiz</div>
    <div class="who" id="who">Tu nave está esperando</div>
  </aside>
</div>
<script>
const $=id=>document.getElementById(id);
// Nave de bloques 3D
const U=16,H=16,D=6;
function tone(h,a){const n=parseInt(h.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
 const f=v=>Math.max(0,Math.min(255,Math.round(a>0?v+(255-v)*a:v*(1+a))));return`rgb(${f(r)},${f(g)},${f(b)})`}
function brick([x,y,w,c]){
 const W=w*U,L=tone(c,.35),K=tone(c,-.35);
 let g=`<polygon points="${x},${y} ${x+D},${y-D} ${x+W+D},${y-D} ${x+W},${y}" fill="${L}"/>`+
 `<polygon points="${x+W},${y} ${x+W+D},${y-D} ${x+W+D},${y+H-D} ${x+W},${y+H}" fill="${K}"/>`+
 `<rect x="${x}" y="${y}" width="${W}" height="${H}" fill="${c}"/><rect x="${x}" y="${y}" width="${W}" height="${H}" fill="none" stroke="${K}" stroke-width=".6"/>`;
 for(let i=0;i<w;i++){const cx=x+i*U+U/2+D/2,cy=y-D/2;
  g+=`<rect x="${cx-4.5}" y="${cy-4}" width="9" height="4" fill="${K}"/><ellipse cx="${cx}" cy="${cy}" rx="4.5" ry="2" fill="${K}"/><ellipse cx="${cx}" cy="${cy-4}" rx="4.5" ry="2" fill="${L}"/>`}
 return g;
}
const PAD=[[22,300,12,"#3A4A8C"]];
const LAYERS={
 1:[[70,282,2,"#2E2366"],[118,282,2,"#2E2366"],[94,282,2,"#41328D"]],
 4:[[30,264,2,"#7E63F4"],[46,246,1,"#7E63F4"],[46,228,1,"#7E63F4"],[158,264,2,"#7E63F4"],[158,246,1,"#7E63F4"],[158,228,1,"#7E63F4"]],
 2:[[62,264,6,"#FFFFFF"],[62,246,6,"#41328D"],[62,228,6,"#FFFFFF"],[62,210,6,"#FFFFFF"]],
 3:[[62,192,2,"#FFFFFF"],[94,192,2,"#CADCFC"],[126,192,2,"#FFFFFF"],[62,174,2,"#FFFFFF"],[94,174,2,"#CADCFC"],[126,174,2,"#FFFFFF"],[62,156,6,"#FFFFFF"]],
 5:[[70,138,5,"#FF6B4A"],[78,120,4,"#FF6B4A"],[86,102,3,"#FF6B4A"],[94,84,2,"#FF6B4A"],[102,66,1,"#FFFFFF"]]
};
const ghost=[...PAD,...Object.values(LAYERS).flat()].map(([x,y,w])=>`<path d="M${x} ${y}h${w*U}v${H}h${-w*U}z"/>`).join("");
$("shipSvg").innerHTML=
 `<g class="ghost">${ghost}</g>`+
 `<g class="part" data-s="1">${PAD.map(brick).join("")}</g>`+
 `<g><circle class="smoke" cx="60" cy="300" r="14"/><circle class="smoke" cx="170" cy="300" r="14" style="animation-delay:.3s"/><circle class="smoke" cx="110" cy="312" r="18" style="animation-delay:.6s"/></g>`+
 `<g id="rocket">`+
 `<g id="flame"><path d="M78 298 Q110 360 142 298Z" fill="#FF6B4A"/><path d="M92 298 Q110 340 128 298Z" fill="#FFB39F"/><path d="M102 298 Q110 322 118 298Z" fill="#fff"/></g>`+
 [1,4,2,3,5].map(k=>`<g class="part" data-s="${k}">${LAYERS[k].map(brick).join("")}${k===2?`<text id="shipName" x="110" y="258" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="Nunito, sans-serif" letter-spacing=".5"></text>`:""}</g>`).join("")+
 `</g>`;
const RANKS=["Aprendiz","Explorador","Piloto","Copiloto","Estratega","Comandante"];
const d={code:"",el:"",robot:"",task:"",free:"",type:""};
let step=0;

const STEPS=[
 {t:"Paso 1 · Tu identidad",render(s){
   s.innerHTML=`<h2>¿Quién eres, comandante?</h2>
   <label>Tu Código de Comandante<input id="in" maxlength="22" placeholder="Ej. Capitán Rayo" value="${d.code}"></label>
   <p><b>Elige tu elemento</b></p><div class="grid" id="g"></div>`;
   opts("g",[["🌪️ Aire","Rápido y creativo"],["🌊 Agua","Tranquilo y adaptable"],["🔥 Fuego","Valiente y decidido"],["⛰️ Tierra","Firme y organizado"]],"el");
   $("in").oninput=e=>{d.code=e.target.value.trim();ok()};
 },valid:()=>d.code&&d.el},
 {t:"Paso 2 · Tu robot ayudante",render(s){
   s.innerHTML=`<h2>¿Cómo se llamará tu robot ayudante?</h2>
   <p class="muted">Es el equipo que vas a dirigir en el curso.</p>
   <input id="in" maxlength="14" placeholder="Escribe un nombre" value="${d.robot}">
   <p class="muted">¿Sin ideas? Toca uno:</p><div class="grid" id="g"></div>`;
   const g=$("g");["NEXUS","ORION","PIXEL","ATLAS","NOVA","ZETA"].forEach(n=>{const b=document.createElement("button");b.className="chip";b.textContent=n;b.onclick=()=>{$("in").value=n;d.robot=n;ok()};g.appendChild(b)});
   $("in").oninput=e=>{d.robot=e.target.value.trim();ok()};
 },valid:()=>d.robot},
 {t:"Paso 3 · Su primera tarea",render(s){
   s.innerHTML=`<h2>¿Qué tarea aburrida le darías a ${esc(d.robot)}?</h2><div class="grid" id="g"></div>`;
   opts("g",[["📋 Organizar mis pendientes",""],["💬 Responder mensajes",""],["📝 Resumir mis apuntes",""],["⏰ Recordarme cosas",""],["💡 Darme ideas",""],["🎨 Hacer diseños",""]],"task",
    "¡Buena elección! Cuando un robot hace una tarea completa, cada vez que se necesita y sin que lo pidas, se llama <b>proceso agéntico</b>.");
 },valid:()=>d.task},
 {t:"Paso 4 · Cuánta libertad",render(s){
   s.innerHTML=`<h2>¿Cuánta libertad le das para decidir?</h2><div class="grid" id="g"></div>`;
   opts("g",[["🟢 Poca","Me pregunta antes de todo"],["🟡 Media","Me pregunta solo lo importante"],["🔴 Mucha","Decide y actúa solo"]],"free",
    "Todas son válidas. A esto se le llama <b>agencialidad</b>: tú, como comandante, decides cuánta libertad dar.");
 },valid:()=>d.free},
 {t:"Paso 5 · Tipo de ayuda",render(s){
   s.innerHTML=`<h2>¿Cómo quieres que te ayude?</h2><div class="grid" id="g"></div>`;
   opts("g",[["💡 Que me dé ideas","Y yo hago el trabajo"],["🛠️ Que lo haga completo","Y me entregue el resultado"]],"type",
    "Si te da ideas es una <b>IA generadora</b>. Si hace todo el trabajo es una <b>IA constructora</b>. En este curso aprenderás a dirigir las dos.");
 },valid:()=>d.type}
];

function esc(t){return t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function opts(id,list,key,tip){
  const g=$(id);
  list.forEach(([a,b])=>{
    const btn=document.createElement("button");btn.className="chip"+(d[key]===a?" sel":"");
    btn.innerHTML=`<b>${a}</b>${b?`<small>${b}</small>`:""}`;
    btn.onclick=()=>{d[key]=a;[...g.children].forEach(c=>c.classList.remove("sel"));btn.classList.add("sel");if(tip)$("tip").innerHTML="✨ "+tip;ok()};
    g.appendChild(btn);
  });
}
function ok(){$("next").disabled=!STEPS[step].valid()}
function show(){
  $("bar").innerHTML=STEPS.map((_,i)=>`<i class="${i<=step?"on":""}"></i>`).join("");
  const s=$("stage");STEPS[step].render(s);
  s.insertAdjacentHTML("afterbegin",`<p class="kicker">${STEPS[step].t}</p>`);
  s.insertAdjacentHTML("beforeend",`<div class="tip" id="tip"></div><button class="btn" id="next">${step===4?"Despegar 🚀":"Siguiente paso"}</button>`);
  $("next").onclick=next;ok();
  const f=s.querySelector("input");if(f)f.focus();
}
function next(){
  document.querySelectorAll(`[data-s="${step+1}"]`).forEach(g=>g.classList.add("on"));
  if(step===1)$("shipName").textContent=d.robot.toUpperCase();
  $("rank").textContent=RANKS[step+1];
  $("who").textContent=`${d.el.split(" ")[0]} ${d.code}`;
  if(step===4){step++;launch();return}
  step++; show();
}
function launch(){
  $("next").disabled=true;
  const c=$("count"),r=$("rocket"),sp=$("space"),svg=$("shipSvg");
  const seq=["3","2","1","🚀"];let i=0;
  setTimeout(()=>{svg.classList.add("launch","done");r.classList.add("shake")},300);
  const t=setInterval(()=>{c.textContent=seq[i++];if(i>seq.length){clearInterval(t);c.textContent="";
    r.classList.remove("shake");r.classList.add("fly");sp.classList.add("warp");
    setTimeout(()=>{finish();},900);
    setTimeout(()=>{r.classList.remove("fly");r.classList.add("back")},2000);
    setTimeout(()=>{r.classList.remove("back");r.classList.add("float");sp.classList.remove("warp");svg.classList.remove("launch")},3600);
  }},700);
}
function finish(){
  $("bar").innerHTML=STEPS.map(()=>`<i class="on"></i>`).join("");
  const line=`🚀 ${d.code} | Robot: ${d.robot} | Tarea: ${d.task.replace(/^\S+\s/,"")} | Libertad: ${d.free.replace(/^\S+\s/,"")}`;
  $("stage").innerHTML=`<h2>¡Nave lista, Comandante ${esc(d.code)}!</h2>
  <p>Tú y ${esc(d.robot)} están listos para despegar.</p>
  <p><b>Copia esto y pégalo en el chat de Zoom:</b></p>
  <div class="final" id="final">${esc(line)}</div>
  <button class="btn" id="copy">Copiar</button>
  <p class="muted">La tarea que elegiste puede ser tu primer encargo para el mini reto.</p>`;
  $("copy").onclick=async()=>{try{await navigator.clipboard.writeText(line);$("copy").textContent="Copiado ✓"}catch(e){$("copy").textContent="Selecciona el texto y cópialo"}};
}
show();
</script>
</body>
</html>
